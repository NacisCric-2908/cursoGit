[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "unit: tests unitarios (rápidos, sin dependencias externas)",
    "integration: tests de integración (base de datos real, varios componentes)",
]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["src"]
branch = true
relative_files = true

[tool.coverage.report]
show_missing = true
