name: CI

on:
  pull_request:
    branches: [develop, test, main]
  push:
    branches: [develop, test]
  workflow_dispatch:
  workflow_call:          # permite que cd.yml reutilice este CI
    secrets:
      SONAR_TOKEN:
        required: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ruff==0.8.4
      - name: Revisar estilo y errores
        run: ruff check src tests

  tests:
    name: tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt
      - name: Tests unitarios
        run: pytest -m unit --cov --cov-report=
      - name: Tests de integración
        run: pytest -m integration --cov --cov-append --cov-report=xml --cov-report=html --cov-report=term --cov-fail-under=80
      - name: Guardar reporte de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: |
            coverage.xml
            htmlcov/

  sonarqube:
    name: sonarqube
    runs-on: ubuntu-latest
    needs: tests
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Descargar reporte de cobertura
        uses: actions/download-artifact@v4
        with:
          name: cobertura
      - name: Análisis con SonarQube Cloud
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true
